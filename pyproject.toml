[project]
name = "agentic-domain-runtime"
version = "0.1.0"
description = "A local-first agentic domain runtime with isolated domain assemblies."
requires-python = ">=3.13, <3.14"
dependencies = [
    "pydantic>=2.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "ruff>=0.15.9",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
