[project]
name = "agentic-domain-runtime"
version = "0.1.0"
description = "A local-first agentic domain runtime with isolated domain assemblies."
requires-python = ">=3.13, <3.14"
dependencies = [
    "aiogram>=3.0.0",
    "python-dotenv>=1.0.0",
    "redis>=4.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "aiohttp>=3.8.0",
    "supabase>=2.24.0",
    "google-genai>=1.70.0",
    "pyyaml>=6.0",
    "pillow>=12.2.0",
    "imageio-ffmpeg>=0.6.0",
]

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "ruff>=0.15.9",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "commentjson>=0.1.4",
]
