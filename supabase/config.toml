# A string used to distinguish different Supabase projects on the same host.
project_id = "agentic-domain-runtime"

[api]
enabled = true
port = 54321
schemas = ["public", "core", "kitchen", "books", "med", "api", "graphql_public"]
extra_search_path = ["public", "core", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 6

[realtime]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
